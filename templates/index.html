<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Translation Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Language Translation Tool</h1>
      <p class="subtitle">Translate text between languages with auto-detection.</p>
    </header>

    <section class="card">
      <!-- Error banner -->
      <div id="error" class="error hidden" role="alert"></div>

      <!-- Language selector bar -->
      <div class="lang-bar">
        <div class="lang-box">
          <label for="source">From</label>
          <select id="source" aria-label="Source language">
            <option value="auto" selected>Auto-detect</option>
            {% for name, code in languages %}
            <option value="{{ code }}">{{ name | title }}</option>
            {% endfor %}
          </select>
        </div>

        <button id="swap-btn" class="swap" type="button" title="Swap languages" aria-label="Swap languages">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 16-4-4 4-4"></path>
            <path d="M3 12h18"></path>
            <path d="m17 8 4 4-4 4"></path>
          </svg>
        </button>

        <div class="lang-box">
          <label for="target">To</label>
          <select id="target" aria-label="Target language">
            {% for name, code in languages %}
            <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name | title }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Text panes -->
      <div class="panes">
        <div class="pane">
          <div class="pane-header">
            <span class="pane-title">Input</span>
          </div>
          <div class="textarea-wrapper">
            <textarea id="input" rows="8" placeholder="Type or paste text to translate…" maxlength="5000" spellcheck="false"></textarea>
          </div>
          <div class="pane-foot">
            <span id="char-count">0 / 5,000</span>
            <button id="clear-btn" class="ghost text-btn" type="button">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span>Clear</span>
            </button>
          </div>
        </div>

        <div class="pane output-pane">
          <div class="pane-header">
            <span class="pane-title">Translation</span>
          </div>
          <div class="textarea-wrapper">
            <div id="output" class="output" data-placeholder="Translation will appear here…"></div>
          </div>
          <div class="pane-foot">
            <span id="status"></span>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <button id="translate-btn" class="primary" type="button">
          <span>Translate</span>
          <svg class="arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
